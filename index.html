<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For Bharti ❤️</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

    </div>



    <!-- Loading -->

    <section
        class="screen active"
        id="loadingScreen">

        <div class="card">

            <h1>Preparing something special...</h1>

            <div class="progress">

                <div id="progressBar"></div>

            </div>

            <p>Please wait...</p>

        </div>

    </section>



    <!-- Invitation -->

    <section
        class="screen"
        id="inviteScreen">

        <div class="card">

            <h1>You've been invited to something...</h1>

            <p class="subtitle">

                I made a tiny surprise 😊

            </p>

            <button
                class="primaryBtn"
                id="openInvite">

                Open Invitation

            </button>

        </div>

    </section>



    <!-- Intro -->

    <section
        class="screen"
        id="introScreen">

        <div class="card">

            <h1>Hey Bharti 👋</h1>

            <p class="smallText">

                I wanted to ask you something...

            </p>

            <button
                class="primaryBtn"
                id="continueBtn">

                Continue

            </button>

        </div>

    </section>



    <!-- Proposal -->

    <section
        class="screen"
        id="proposalScreen">

        <div class="card">

            <h1>

                Will you go out with me?

            </h1>

            <div class="buttonGroup">

                <button
                    class="yesButton"
                    id="yesBtn">

                    Yes ❤️

                </button>

                <button
                    class="noButton"
                    id="noBtn">

                    No 🙈

                </button>

            </div>

            <p id="message"></p>

        </div>

    </section>



    <!-- Planner -->

    <section
        class="screen"
        id="plannerScreen">

        <div class="card plannerCard">

            <h2>Let's plan it ✨</h2>

            <div class="field">

                <label>Date</label>

                <input
                    type="date"
                    id="date">

            </div>

            <div class="field">

                <label>Time</label>

                <input
                    type="time"
                    id="time">

            </div>

            <div class="field">

                <label>Place</label>

                <select
                    id="place"
                    class="placeSelect">

                    <option value="">Choose one</option>

                    <option>Connaught Place</option>

                    <option>Majnu Ka Tila</option>

                    <option>Near Keshav Puram</option>

                    <option>Anywhere in Delhi</option>

                    <option>Anywhere in Gurgaon</option>

                    <option>You choose...</option>

                </select>

                <input
                    type="text"
                    id="customPlace"
                    class="customPlace"
                    placeholder="Where would you like to go?">

            </div>

            <button
                class="primaryBtn"
                id="plannerNext">

                Next

            </button>

        </div>

    </section>



    <!-- Food -->

    <section
        class="screen"
        id="foodScreen">

        <div class="card">

            <h2>What should we eat?</h2>

            <div
                class="foodGrid"
                id="foodGrid">

            </div>

            <input
                type="text"
                id="customFood"
                class="customFood"
                placeholder="What are you craving?">

            <button
                class="primaryBtn"
                id="foodNext">

                Finish

            </button>

        </div>

    </section>



    <!-- Final -->

    <section
        class="screen"
        id="finalScreen">

        <div class="card">

            <div class="check">

                ✓

            </div>

            <h2>It's a date! ❤️</h2>

            <div
                class="summary"
                id="summary">

            </div>

            <div class="finalMessage">

                Looking forward to it 😊

            </div>

        </div>

    </section>



    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
